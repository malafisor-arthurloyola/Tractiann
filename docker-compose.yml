services:
  postgres-agent:
    image: postgres:16-alpine
    container_name: tractian-agent-postgres
    environment:
      POSTGRES_USER: tractian
      POSTGRES_PASSWORD: tractian_dev
      POSTGRES_DB: tractian_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tractian -d tractian_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: tractian-agent-phoenix
    ports:
      - "6006:6006"
    environment:
      PHOENIX_OTEL_ENDPOINT: http://localhost:6006
    volumes:
      - phoenix_data:/data

volumes:
  postgres_data:
  phoenix_data:
