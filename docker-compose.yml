services:
  postgres-agent:
    image: postgres:16-alpine
    container_name: tractian-agent-postgres
    environment:
      POSTGRES_USER: tractian
      POSTGRES_PASSWORD: tractian_dev
      POSTGRES_DB: tractian_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tractian -d tractian_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: tractian-agent-phoenix
    ports:
      - "6006:6006"
    environment:
      # Persistência: o Phoenix grava os traces no MESMO Postgres da tabela
      # `execucoes`, num schema separado. Sem isto ele usaria um SQLite dentro
      # do container e os traces sumiriam a cada restart.
      PHOENIX_SQL_DATABASE_URL: postgresql://tractian:tractian_dev@postgres-agent:5432/tractian_agent
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
      # Arquivos auxiliares vão para o volume (antes o Phoenix escrevia em
      # /root/.phoenix, fora do volume declarado — o mount era um no-op).
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data
    depends_on:
      postgres-agent:
        condition: service_healthy

volumes:
  postgres_data:
  phoenix_data:
